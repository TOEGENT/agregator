{% extends "base.html" %}
{% block title %}Поиск: {{ query }} — СнабГарант-НТ{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('index') }}">← Каталог</a>
<form class="toolbar search-form" action="{{ url_for('search') }}"><input name="q" value="{{ query }}" placeholder="Поиск"><button>Найти</button></form>
<h1>Результаты поиска</h1>
<div class="product-grid">{% for item in matches %}<a class="product-card" href="{{ url_for('product', card_id=item.id) }}">{% if item.card.images %}<img class="product-preview" src="{{ item.card.images[0] }}" alt="{{ item.card.name }}">{% endif %}<strong>{{ item.card.name }}</strong></a>{% endfor %}</div>
{% endblock %}
