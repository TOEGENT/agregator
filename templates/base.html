<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Каталог профессионального инструмента и строительных материалов">
  <title>{% block title %}СнабГарант-НТ — каталог товаров{% endblock %}</title>
  <style>
    :root{--red:#e53935;--dark:#17191c;--paper:#f4f5f7;--line:#e1e4e8;--muted:#69717c}*{box-sizing:border-box}
    body{margin:0;color:var(--dark);background:var(--paper);font:16px/1.5 Arial,sans-serif}a{color:inherit}
    .site-header{background:var(--dark);color:#fff}.header-inner,main{width:min(1180px,calc(100% - 32px));margin:auto}
    .header-inner{min-height:72px;display:flex;align-items:center;gap:24px}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:900}.brand span{color:var(--red)}.header-note{margin-left:auto;color:#aeb4bc;font-size:14px}.contacts{position:relative}.contacts summary{padding:10px 16px;background:var(--red);border-radius:8px;color:#fff;font-weight:700;cursor:pointer;list-style:none}.contacts summary::-webkit-details-marker{display:none}.contacts-card{position:absolute;top:calc(100% + 10px);right:0;z-index:100;width:min(390px,calc(100vw - 32px));min-width:245px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 35px rgba(0,0,0,.2);color:var(--dark)}.contacts-card a{display:block;padding:5px 0;color:var(--dark);text-decoration:none}.contacts-card a:hover{color:var(--red)}.contacts-address{margin:8px 0 0;padding-top:10px;border-top:1px solid var(--line);font-style:normal;line-height:1.4}
    main{padding:40px 0 64px}h1{margin:0 0 12px;font-size:clamp(30px,5vw,50px);line-height:1.08;letter-spacing:-.035em}h2{margin:36px 0 16px}.lead{max-width:720px;margin:0;color:var(--muted);font-size:18px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:28px 0}.search-form{display:flex;width:min(720px,100%);padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(18,23,30,.08)}
    input{min-width:0;flex:1;padding:13px 14px;border:0;outline:0;background:transparent;font:inherit}button,.button{border:0;border-radius:8px;padding:12px 20px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .catalogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.catalog-link{display:block;min-height:132px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:.18s ease}.catalog-link:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(18,23,30,.1)}
    .catalog-link strong{display:block;margin:8px 0 18px;font-size:19px;line-height:1.25}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.muted{color:var(--muted)}.back{display:inline-block;margin-bottom:24px;color:var(--muted);text-decoration:none}.back:hover{color:var(--red)}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.product-card{display:flex;flex-direction:column;min-height:330px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:.18s ease}.product-card:hover{transform:translateY(-3px);border-color:var(--red);box-shadow:0 12px 28px rgba(18,23,30,.1)}.product-preview{width:100%;height:220px;margin-bottom:16px;object-fit:contain}.product-preview-placeholder{display:flex;align-items:center;justify-content:center;width:100%;height:220px;margin-bottom:16px;background:var(--paper);color:var(--muted);border-radius:8px}.product-card strong{font-size:17px;line-height:1.35}.product-card .muted{margin-top:auto;padding-top:14px}.product-body{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}
    .product-showcase{display:grid;grid-template-columns:minmax(0,650px) minmax(260px,1fr);gap:28px;align-items:start;margin:18px 0}.product-section-title{margin:0 0 12px;font-size:22px}.gallery{display:grid;grid-template-columns:76px minmax(0,560px);gap:14px}.gallery-thumbs{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow:auto}.gallery-thumb{width:68px;height:68px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer}.gallery-thumb.active{border:2px solid var(--red)}.gallery-thumb img{width:100%;height:100%;object-fit:contain}.gallery-main{position:relative;width:100%;height:480px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in}.gallery-main img{width:100%;height:100%;object-fit:contain}.gallery-zoom-label{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(18,23,30,.12);font-size:14px}.lightbox{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.84)}.lightbox[hidden]{display:none}.lightbox img{max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);object-fit:contain}.lightbox-close{position:absolute;top:18px;right:18px;width:44px;height:44px;padding:0;border-radius:50%;font-size:26px}.description{margin:0;white-space:pre-wrap}table{width:100%;margin:0 0 16px;border-collapse:collapse}td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{width:35%;color:var(--muted)}
    .pages{display:flex;gap:7px;flex-wrap:wrap;margin:28px 0}.pages button{min-width:42px;padding:10px;background:#fff;color:var(--dark);border:1px solid var(--line)}.pages button.active{background:var(--dark);color:#fff}.results{margin:24px 0;padding:0;list-style:none;display:grid;gap:10px}.results a{display:block;padding:18px;background:#fff;border:1px solid var(--line);border-radius:10px;text-decoration:none}.results a:hover{border-color:var(--red)}
    @media(max-width:850px){.product-showcase{grid-template-columns:1fr}}@media(max-width:600px){.header-inner{gap:12px}.header-note{display:none}.contacts{margin-left:auto}.contacts summary{padding:9px 12px}.contacts-card{right:0;min-width:230px}main{padding-top:28px}.search-form{flex-direction:column}.search-form button{width:100%}.product-grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery-thumbs{order:2;flex-direction:row;max-height:none}.gallery-main{height:320px}}
  </style>
</head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}">Снаб<span>Гарант-НТ</span></a><span class="header-note">Профессиональное снабжение</span><details class="contacts"><summary>Контакты</summary><div class="contacts-card"><a href="mailto:snabgarant-nt@yandex.ru">snabgarant-nt@yandex.ru</a><a href="tel:+79222130999">+7 (922) 213-09-99</a><address class="contacts-address">622002, Свердловская область, г. Нижний Тагил, Липовый тракт, д. 18, офис 20</address></div></details></div></header><main>{% block content %}{% endblock %}</main></body>
</html>
