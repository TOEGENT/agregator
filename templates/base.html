<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Каталог профессионального инструмента и строительных материалов">
  <title>{% block title %}СнабГарант — каталог товаров{% endblock %}</title>
  <style>
    :root{--red:#e53935;--dark:#17191c;--paper:#f4f5f7;--line:#e1e4e8;--muted:#69717c}*{box-sizing:border-box}
    body{margin:0;color:var(--dark);background:var(--paper);font:16px/1.5 Arial,sans-serif}a{color:inherit}
    .site-header{background:var(--dark);color:#fff}.header-inner,main{width:min(1180px,calc(100% - 32px));margin:auto}
    .header-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:900}.brand span{color:var(--red)}.header-note{color:#aeb4bc;font-size:14px}
    main{padding:40px 0 64px}h1{margin:0 0 12px;font-size:clamp(30px,5vw,50px);line-height:1.08;letter-spacing:-.035em}h2{margin:36px 0 16px}.lead{max-width:720px;margin:0;color:var(--muted);font-size:18px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:28px 0}.search-form{display:flex;width:min(720px,100%);padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(18,23,30,.08)}
    input{min-width:0;flex:1;padding:13px 14px;border:0;outline:0;background:transparent;font:inherit}button,.button{border:0;border-radius:8px;padding:12px 20px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .catalogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.catalog-link{display:block;min-height:132px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:.18s ease}.catalog-link:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(18,23,30,.1)}
    .catalog-link strong{display:block;margin:8px 0 18px;font-size:19px;line-height:1.25}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.muted{color:var(--muted)}.back{display:inline-block;margin-bottom:24px;color:var(--muted);text-decoration:none}.back:hover{color:var(--red)}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.product summary{min-height:82px;padding:18px 44px 18px 18px;cursor:pointer;font-size:17px;font-weight:700;list-style:none}.product[open]{grid-column:1/-1}.product-body{padding:0 18px 20px;border-top:1px solid var(--line)}
    .images{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.images img{width:210px;height:170px;padding:8px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}.description{max-width:850px;white-space:pre-wrap}table{width:100%;margin:16px 0;border-collapse:collapse}td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{width:35%;color:var(--muted)}
    .pages{display:flex;gap:7px;flex-wrap:wrap;margin:28px 0}.pages button{min-width:42px;padding:10px;background:#fff;color:var(--dark);border:1px solid var(--line)}.pages button.active{background:var(--dark);color:#fff}.results{margin:24px 0;padding:0;list-style:none;display:grid;gap:10px}.results a{display:block;padding:18px;background:#fff;border:1px solid var(--line);border-radius:10px;text-decoration:none}.results a:hover{border-color:var(--red)}
    @media(max-width:600px){.header-note{display:none}main{padding-top:28px}.search-form{flex-direction:column}.search-form button{width:100%}.product-grid{grid-template-columns:1fr}.images img{width:100%;height:220px}}
  </style>
</head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}">Снаб<span>Гарант</span></a><span class="header-note">Профессиональное снабжение</span></div></header><main>{% block content %}{% endblock %}</main></body>
</html>
